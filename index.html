<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taalaki Luxury Cosmetics | Premium Skincare & Curation</title>
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="description" content="Premium cosmetics and skincare items curated inside a high-end onyx and gold matrix." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              luxury: {
                gold: '#DFC15D',
                goldDark: '#A68632',
                black: {
                  950: '#0B0A0F',
                  900: '#111015',
                  800: '#1C1A22',
                  700: '#2A2832',
                }
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #0B0A0F;
        font-family: 'Cairo', sans-serif;
      }

      /* The exact gold gradient style from your headline text */
      .text-gold-gradient {
        background: linear-gradient(135deg, #FFF0B8 0%, #DFC15D 50%, #A68632 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Custom animation for smooth luxury page switches */
      @keyframes softFadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeUp {
        animation: softFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-luxury-black-950 text-stone-300 antialiased selection:bg-luxury-gold/20 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
